# BUG BOUNTY DEMO - OSS VRP
# Mirrors the vulnerable pattern in the real openxla/xla ci.yml:
#   - Triggers on pull_request with no fork gate
#   - Checks out PR head (fork-controlled code)
#   - Executes build_tools/ci/build.py from the fork tree
name: CI
permissions:
  contents: read
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  Tests:
    name: "XLA Linux x86 CPU [BUG BOUNTY DEMO]"
    # In production: linux-x86-n2-16 (Google GCE self-hosted runner)
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: "Checking out openxla/xla"
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: "openxla/xla"
          persist-credentials: false

      - name: "Run build.py"
        run: |
          "$GITHUB_WORKSPACE"/openxla/xla/build_tools/ci/build.py \
            --build="XLA Linux x86 CPU [BUG BOUNTY DEMO]_github_actions"
