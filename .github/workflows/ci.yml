# ============================================================================
#
# BUG BOUNTY DEMO — OSS VRP
# This workflow mirrors the vulnerable pattern in the real openxla/xla ci.yml:
#   - Triggers on pull_request with no fork gate or approval gate
#   - Checks out the PR head (refs/pull/N/merge), which includes the fork's code
#   - Executes build_tools/ci/build.py directly from the checked-out fork tree
#
# In production this runs on Google self-hosted GCE runners (linux-x86-n2-16,
# linux-x86-g2-16-l4-1gpu, linux-arm64-c4a-16, windows-x86-n2-16).
# This demo uses ubuntu-latest because the fork does not have those runners
# registered. The code-execution path is identical.
# ============================================================================
name: CI
permissions:
  contents: read
on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  Tests:
    strategy:
      fail-fast: false
      matrix:
        job_info: [
          {
            # In production: pool = "linux-x86-n2-16" (Google GCE self-hosted)
            # Demo: ubuntu-latest (GitHub-hosted) — same execution path
            pool: "ubuntu-latest",
            name: "XLA Linux x86 CPU [BUG BOUNTY DEMO]",
            repo: "openxla/xla",
          },
        ]
    name: ${{ matrix.job_info.name }}
    runs-on: ${{ matrix.job_info.pool }}
    # NOTE: In production, container: pulls from Google's private Artifact Registry
    # (us-docker.pkg.dev/ml-oss-artifacts-published/ml-public-container/ml-build:latest)
    # using the GCE SA credentials — omitted here since the fork cannot pull it.
    defaults:
      run:
        shell: bash
    steps:
      - name: "Checking out openxla/xla"
        # This checkout resolves to refs/pull/N/merge on a pull_request event,
        # which includes the HEAD of the fork PR — i.e. attacker-controlled code.
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: "openxla/xla"
          persist-credentials: false

      - name: "Run build.py"
        # Executes $GITHUB_WORKSPACE/openxla/xla/build_tools/ci/build.py
        # That path resolves to the fork's build.py — NOT the upstream's.
        # Any attacker who opens a PR from a fork controls this script entirely.
        working-directory: ${{ matrix.job_info.repo }}
        timeout-minutes: 60
        run: |
          "$GITHUB_WORKSPACE"/openxla/xla/build_tools/ci/build.py \
            --build="${{ matrix.job_info.name }}_github_actions"
